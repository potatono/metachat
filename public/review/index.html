<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Code Review</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/css/diff2html.min.css">
    <link rel="stylesheet" href="/review/review.css">
    <link rel="stylesheet" href="/bridge.css">
    <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/js/diff2html.min.js"></script>
</head>
<body>
    <header>
        <span id="mode" class="badge">idle</span>
        <span id="activity" class="progress"></span>
        <span id="chunk" class="progress"></span>
        <span id="file" class="file"></span>
        <span id="hunk" class="progress"></span>
        <span id="status" title="bridge connection">&#128992;</span>
    </header>

    <main id="diff-container">
        <div id="diff" class="empty">waiting for a review to start&hellip;</div>
    </main>

    <aside id="side" class="hidden">
        <div id="thread"></div>
        <div id="debate" class="debate-status"></div>
        <div id="comments"></div>
    </aside>

    <!-- What the coder and reviewer are working on right now; one row each. -->
    <section id="thinking" class="hidden"></section>

    <footer>
        <span id="caption-name">DYSON</span>
        <span id="caption"></span>
    </footer>

    <!-- bridge.js adds the token prompt when no token is stored. -->
    <script src="/bridge.js"></script>
    <script src="/review/review.js"></script>
</body>
</html>
