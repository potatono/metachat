<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coder Console</title>
    <link rel="stylesheet" href="/console.css">
    <link rel="stylesheet" href="/bridge.css">
</head>
<body>
    <header>
        <span id="mode" class="badge">idle</span>
        <span id="chunk" class="progress"></span>
        <span id="label" class="label"></span>
        <a href="/review" class="progress" target="_blank">review page</a>
        <span id="status" title="bridge connection">&#128992;</span>
    </header>

    <main id="log">
        <div id="empty" class="empty">Type a request below to start a conversation.</div>
    </main>

    <!-- A spoken change request being dictated ("Dyson, here's my change
         request" ... "Okay Dyson, begin"), shown live as it's captured. -->
    <section id="dictation" class="hidden">
        <div class="dictation-head">
            <span class="rec"></span> Dictating a change request
            <span class="hint">say &ldquo;Okay Dyson, begin&rdquo; to send, &ldquo;Dyson, cancel&rdquo; to drop it</span>
        </div>
        <div id="dictation-text"></div>
    </section>

    <form id="composer">
        <textarea id="input" rows="3"
                  placeholder="Ask for a change&hellip;  (Enter sends, Shift+Enter for a new line)"></textarea>
        <button type="submit">Send</button>
    </form>

    <!-- bridge.js adds the token prompt when no token is stored. -->
    <script src="/bridge.js"></script>
    <script src="/console.js"></script>
</body>
</html>
